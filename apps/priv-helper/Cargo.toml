[package]
name = "builtpanel-priv-helper"
description = "Built Panel minimal privileged helper for an allowlisted set of host operations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "builtpanel_priv_helper"
path = "src/lib.rs"

[[bin]]
name = "builtpanel-priv-helper"
path = "src/main.rs"

# Kept deliberately small: this program runs as root. No async runtime, no
# network stack, no argument-parsing framework.
[dependencies]
builtpanel-common.workspace = true
builtpanel-backup.workspace = true
builtpanel-fileops.workspace = true
builtpanel-node-protocol.workspace = true
builtpanel-safe-fs.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
# Safe wrapper for SO_PEERCRED (who is on the other end of the socket); the
# workspace forbids `unsafe`.
rustix = { version = "1", default-features = false, features = ["std", "net", "process"] }

[lints]
workspace = true
