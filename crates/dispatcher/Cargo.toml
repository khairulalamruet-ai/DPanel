[package]
name = "builtpanel-dispatcher"
description = "Sends ledger operations to connected nodes and records their results."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-cache.workspace = true
builtpanel-database.workspace = true
builtpanel-node-gateway.workspace = true
builtpanel-node-protocol.workspace = true
builtpanel-operations.workspace = true
builtpanel-domain.workspace = true
builtpanel-events.workspace = true
builtpanel-kernel.workspace = true
builtpanel-tenant-stack.workspace = true
builtpanel-web-config.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
tracing = "0.1.44"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
builtpanel-catalog.workspace = true
builtpanel-pki.workspace = true
builtpanel-node-agent = { path = "../../apps/node-agent" }
secrecy = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "migrate"] }
time = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
uuid = { version = "1", features = ["serde", "v7"] }
