[package]
name = "builtpanel-kernel"
description = "Module trait, module registry, event bus and core error types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The `Module` trait hands out Axum routers.
axum = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.21"
# Module manifests (`module.toml`) are TOML.
toml = "1"
serde_json = "1"
# Ids inside events.
uuid = { version = "1", features = ["serde"] }
# `oneshot` to hand a request to the currently mounted router.
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
