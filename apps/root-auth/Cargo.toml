[package]
name = "builtpanel-root-auth"
description = "Built Panel root login helper: checks the server's root password for the control plane, nothing else."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "builtpanel_root_auth"
path = "src/lib.rs"

[[bin]]
name = "builtpanel-root-auth"
path = "src/main.rs"

[dependencies]
# The two schemes Debian and Ubuntu store in /etc/shadow: yescrypt ($y$, the default since
# Debian 11 / Ubuntu 22.04) and SHA-crypt ($6$, $5$, older systems). Pure Rust: the workspace
# forbids `unsafe`, which a binding to libcrypt would need.
yescrypt = { version = "0.1.0", default-features = false, features = ["password-hash"] }
sha-crypt = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
# Who is on the other end of the socket (SO_PEERCRED) without `unsafe`.
rustix = { version = "1", default-features = false, features = ["std", "net"] }
# Wipes the password from memory once it is checked.
zeroize = "1"

[lints]
workspace = true
