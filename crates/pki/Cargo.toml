[package]
name = "builtpanel-pki"
description = "Internal certificate authority for node mTLS: create the CA, issue and inspect certificates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Certificate and CSR generation/signing. `ring` is the single crypto backend
# for the workspace (rustls will use it too): smaller and quicker to build than
# aws-lc-rs. `x509-parser` lets rcgen read the CSRs that agents send.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
# Reads back the CA certificate (is it a real, matching, unexpired CA?). Same
# version rcgen already uses; `verify` checks the CA's self-signature.
x509-parser = { version = "0.18", features = ["verify"] }
# CA and server private keys never appear in Debug output.
secrecy = "0.10"
# Certificate fingerprints.
sha2 = "0.11"
# Validity periods and timestamps (rcgen's time type).
time = { version = "0.3", features = ["formatting"] }
# Random serial numbers.
getrandom = "0.4"
thiserror = "2.0.21"
uuid = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v7"] }
