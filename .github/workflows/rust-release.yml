# Release pipeline (T19.11): a tag vX.Y.Z builds the release, checks that the build is
# reproducible, signs a manifest, publishes the artifacts with the changelog, deploys to staging,
# and runs the smoke test there. Production is a separate step that a person starts by hand:
# the workflow rust-promote.yml (Actions > rust-promote > Run workflow), which checks the signed
# manifest before it deploys. (GitHub's "required reviewers" for an environment is not available
# on a free plan for a private repository; starting the workflow is the approval.)
#
# One-time setup (repository settings), none of it is in the repository:
#   Environments `staging` and `production`.
#   Per environment: variable PANEL_URL; secrets DEPLOY_HOST (user@host), DEPLOY_SSH_KEY
#   (private key of a user that may `sudo` the deploy script), DEPLOY_KNOWN_HOSTS.
#   Repository: secret RELEASE_SIGNING_KEY and variable RELEASE_KID (the release key).
name: rust-release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SQLX_OFFLINE: "true"

jobs:
  web:
    name: the web interface
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: One archive for each app, the same bytes every time (sorted, fixed owner and time)
        run: |
          mkdir -p ../web-dist
          for app in client admin; do
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" -cf - -C "apps/$app/dist" . | gzip -n -9 > "../web-dist/web-$app"
          done
          ls -l ../web-dist
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web-dist/

  build:
    name: build (${{ matrix.arch }})
    needs: web
    strategy:
      fail-fast: true
      matrix:
        include:
          # Built on Ubuntu 22.04: a program carries the glibc version of the machine it was
          # linked on, so a build on 22.04 (glibc 2.35) runs on 22.04, 24.04 and Debian 12,
          # while one made on 24.04 (glibc 2.39) runs on neither of the older systems.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - name: The tag matches the version in Cargo.toml
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="builtpanel-control-api"))')"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $have"; exit 1; }
      - name: Build (locked, reproducible flags)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=$HOME/.cargo=/cargo -C strip=symbols"
          cargo build --release --locked -p builtpanel-control-api -p builtpanel-bpctl -p builtpanel-node-agent -p builtpanel-priv-helper -p builtpanel-root-auth -p builtpanel-license-authority
          # No program may need a newer glibc than the oldest system the installer supports.
          for f in target/release/builtpanel-control-api target/release/bpctl target/release/builtpanel-agent target/release/builtpanel-priv-helper target/release/builtpanel-root-auth target/release/builtpanel-license-authority; do
            v="$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1 | cut -d_ -f2)"
            [ "$(printf '%s\n2.35\n' "$v" | sort -V | tail -1)" = 2.35 ] || { echo "$f needs glibc $v (more than 2.35)"; exit 1; }
          done
          mkdir -p dist/bin
          for b in builtpanel-control-api bpctl builtpanel-agent builtpanel-priv-helper builtpanel-root-auth builtpanel-license-authority; do
            install -m 0755 "target/release/$b" dist/bin/
          done
      - name: SBOM
        run: |
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --format json --spec-version 1.5
          mkdir -p dist/sbom
          find . -name '*.cdx.json' -not -path './target/*' -not -path './dist/*' -exec cp {} dist/sbom/ \;
      - uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: dist/web
      - name: Package
        run: |
          v="${GITHUB_REF_NAME#v}"
          cp -r deploy/install.sh deploy/ui.sh deploy/systemd deploy/agent deploy/config deploy/runbooks deploy/release dist/
          cp openapi.json dist/
          name="builtpanel-${v}-linux-${{ matrix.arch }}"
          mkdir "$name" && cp -r dist/* "$name"/
          # Deterministic archive: sorted names, fixed owner and time.
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" -cf - "$name" | gzip -n -9 > "$name.tar.gz"
          sha256sum "$name.tar.gz" | tee "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: builtpanel-*.tar.gz*

  reproduce:
    name: the build is reproducible
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install && rustup show active-toolchain
      - name: Build again, from the same path
        run: |
          # The vendored OpenSSL writes the folder it was built in into the program (its engines
          # and modules folders), and the compiler's path remapping does not reach that, so a
          # second build is compared from the same path as the first (a fresh runner).
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=$HOME/.cargo=/cargo -C strip=symbols"
          # The same packages as the real build: building a different set unifies features
          # differently and gives different bytes.
          cargo build --release --locked -p builtpanel-control-api -p builtpanel-bpctl -p builtpanel-node-agent -p builtpanel-priv-helper -p builtpanel-root-auth -p builtpanel-license-authority
          sha256sum target/release/builtpanel-control-api target/release/bpctl | awk '{print $1}' > /tmp/second.sha
      - uses: actions/download-artifact@v7
        with:
          name: release-x86_64
          path: first
      - name: Same bytes
        run: |
          v="${GITHUB_REF_NAME#v}"
          tar -xzf first/builtpanel-${v}-linux-x86_64.tar.gz -C first
          sha256sum first/builtpanel-${v}-linux-x86_64/bin/builtpanel-control-api first/builtpanel-${v}-linux-x86_64/bin/bpctl | awk '{print $1}' > /tmp/first.sha
          diff /tmp/first.sha /tmp/second.sha && echo "the two builds are identical"
      - name: Keep both programs when they differ, to find out why
        if: failure()
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/diag/first /tmp/diag/second
          cp first/builtpanel-${v}-linux-x86_64/bin/builtpanel-control-api /tmp/diag/first/
          cp target/release/builtpanel-control-api /tmp/diag/second/
          cmp -l /tmp/diag/first/builtpanel-control-api /tmp/diag/second/builtpanel-control-api | wc -l
          for d in first second; do strings -a /tmp/diag/$d/builtpanel-control-api > /tmp/diag/$d.str; done
          diff /tmp/diag/first.str /tmp/diag/second.str | head -40 || true
      - name: Upload the two programs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reproduce-diagnosis
          path: /tmp/diag/

  release:
    name: signed manifest and publish
    needs: [build, reproduce]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # keyless signing with the workflow's identity
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - uses: sigstore/cosign-installer@v4.1.3
      - name: The one-command installer is a release file too
        # The published get.sh carries the installer's look (deploy/ui.sh) inside it.
        run: sed '/^# @UI@$/r deploy/ui.sh' deploy/get.sh > out/get.sh && bash -n out/get.sh
      - name: Manifest (files, sizes, hashes, commit) and its signature
        run: |
          cd out
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          files = sorted(f for f in os.listdir('.') if f.endswith('.tar.gz'))
          manifest = {
              'version': os.environ['GITHUB_REF_NAME'].lstrip('v'),
              'commit': os.environ['GITHUB_SHA'],
              'built_at': int(subprocess.check_output(['git', 'log', '-1', '--format=%ct']).decode()),
              'files': [{'name': f, 'bytes': os.path.getsize(f), 'sha256': hashlib.sha256(open(f, 'rb').read()).hexdigest()} for f in files],
          }
          json.dump(manifest, open('manifest.json', 'w'), indent=2, sort_keys=True)
          PY
          cosign sign-blob --yes --bundle manifest.json.sigstore manifest.json
      - name: Release-key manifest (T17.14)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_KID: ${{ vars.RELEASE_KID }}
        run: |
          # The manifest the installations check (Ed25519, the release key, which is not the
          # license key). It needs the key as a secret; without it the release goes out with
          # the cosign-signed manifest only and this says so.
          if [ -z "$RELEASE_SIGNING_KEY" ] || [ -z "$RELEASE_KID" ]; then
            echo "::warning::RELEASE_SIGNING_KEY or RELEASE_KID is not set: no release-key manifest was made"
            exit 0
          fi
          # The manifest lists the programs themselves (what an installation runs and what the
          # daily integrity scan hashes) and the two web archives, taken out of the x86_64 archive.
          v="${GITHUB_REF_NAME#v}"
          # Not in the checkout: it has a web/ folder of its own (the source of the interface).
          rel="$RUNNER_TEMP/release-files"; mkdir -p "$rel/bin" "$rel/web"
          tar -xzf out/builtpanel-${v}-linux-x86_64.tar.gz -C "$rel/bin" --strip-components=2 "builtpanel-${v}-linux-x86_64/bin"
          tar -xzf out/builtpanel-${v}-linux-x86_64.tar.gz -C "$rel/web" --strip-components=2 "builtpanel-${v}-linux-x86_64/web"
          umask 077
          printf '%s' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release.key"
          "$rel/bin/bpctl" release sign --key "$RUNNER_TEMP/release.key" --kid "$RELEASE_KID" \
            --version "$v" --commit "$GITHUB_SHA" --created-at "$(git log -1 --format=%ct)" \
            --out out/release-manifest.json "$rel"/bin/* "$rel"/web/*
          rm -f "$RUNNER_TEMP/release.key"
      - name: Changelog
        run: deploy/release/changelog.sh "$GITHUB_REF_NAME" > out/CHANGELOG.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Built Panel ${GITHUB_REF_NAME#v}" --notes-file out/CHANGELOG.md --verify-tag
      - uses: actions/upload-artifact@v7
        with:
          name: published
          path: out

  staging:
    name: deploy to staging + smoke test
    needs: release
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: published
          path: out
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: deploy/release/remote-deploy.sh "out/builtpanel-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz" out/release-manifest.json
      - name: Smoke test
        run: deploy/release/smoke.sh "${{ vars.PANEL_URL }}"
