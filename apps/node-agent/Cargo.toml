[package]
name = "builtpanel-node-agent"
description = "Built Panel per-server node agent (typed operations only, never a shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "builtpanel_node_agent"
path = "src/lib.rs"

[[bin]]
# `builtpanel-agent` is the name used in the enrol command shown by the panel.
name = "builtpanel-agent"
path = "src/main.rs"

[dependencies]
builtpanel-common.workspace = true
builtpanel-node-protocol.workspace = true
builtpanel-docker-manager.workspace = true
builtpanel-domain.workspace = true
# Checks an uploaded certificate and its key before the web server gets them.
builtpanel-pki.workspace = true
builtpanel-priv-helper = { path = "../priv-helper" }
builtpanel-backup.workspace = true
builtpanel-backup-dest.workspace = true
builtpanel-tenant-stack.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
clap = { version = "4", features = ["derive", "env"] }
# The agent makes its own key and certificate signing request.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
# Checks what the control plane sends back before anything is stored.
# Reads SQL dumps that were compressed with gzip (T07.07).
zstd = { version = "0.14", default-features = false }
# Account exports are one tar file (T09.11).
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Talks to the shared MariaDB server of the node (loopback only) to make databases and
# users (T07.03). No TLS: the connection never leaves the host.
mysql_async = { version = "0.37", default-features = false, features = ["minimal"] }
# The PostgreSQL server of the node (T07.12): the client, and the SCRAM verifier a password is sent as.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
postgres-protocol = "0.6"
bytes = "1"
x509-parser = { version = "0.18", features = ["verify"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2.0.21"
time = { version = "0.3", features = ["formatting"] }
# `run` waits for a shutdown signal; the control-plane connection (T02.08) will use the same runtime.
tokio = { version = "1", features = ["rt", "macros", "signal", "time", "net", "sync", "io-util"] }
# The only network call the agent makes before it has a certificate: one HTTPS
# POST to enrol. `ureq` is blocking and small; it uses rustls with the `ring`
# backend (the same one rcgen uses) and the bundled Mozilla root certificates.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1", features = ["serde", "v7"] }
# Remembers the result of every operation on disk, so an operation that is sent
# again (lost answer, control plane restart) is answered, not run twice (T02.12).
# Embedded, pure Rust, crash-safe; chosen in ADR 0004.
redb = "4"
# Free and total disk space (statvfs) for the capability report, through a safe
# API: this workspace forbids `unsafe`, so no direct libc calls (T02.13).
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
builtpanel-catalog.workspace = true
builtpanel-node-gateway.workspace = true
builtpanel-operations.workspace = true
# Tests play the control plane: they make a real CA, and the enrolment test runs
# the real enrollment endpoint on a local port.
builtpanel-audit.workspace = true
builtpanel-cache.workspace = true
builtpanel-database.workspace = true
builtpanel-http-kit.workspace = true
builtpanel-mod-nodes.workspace = true
builtpanel-session.workspace = true
axum = "0.8"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "test-util"] }
uuid = { version = "1", features = ["serde", "v7"] }

[lints]
workspace = true
