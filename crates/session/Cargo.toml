[package]
name = "builtpanel-session"
description = "Server-side sessions: Redis hot store, PostgreSQL history, secure cookie and Axum extractor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-cache.workspace = true
builtpanel-http-kit.workspace = true
# OS CSPRNG for session tokens; SHA-256 so only token hashes are stored;
# base64url for the cookie value.
axum = "0.8"
base64 = "0.23"
getrandom = "0.4"
secrecy = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2.0.21"
# RFC 3339 timestamps in the session list (already in the lockfile via sqlx).
time = { version = "0.3", features = ["formatting"] }
# Same version/features as builtpanel-database; the query! macros need the crate in scope.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
