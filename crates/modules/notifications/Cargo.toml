[package]
name = "builtpanel-mod-notifications"
description = "Notifications module: an inbox, email and webhook channels, pause and snooze."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-auth-core.workspace = true
builtpanel-database.workspace = true
builtpanel-http-kit.workspace = true
builtpanel-kernel.workspace = true
builtpanel-rbac.workspace = true
builtpanel-session.workspace = true
builtpanel-settings.workspace = true
axum = "0.8"
# The signature of a webhook.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1.44"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }
# Sends the email channel's messages (the SMTP protocol is not something to write again here).
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "webpki-roots"] }

[dev-dependencies]
builtpanel-cache.workspace = true
builtpanel-mod-auth.workspace = true
secrecy = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tower = { version = "0.5", features = ["util"] }
