[package]
name = "builtpanel-observability"
description = "Tracing, OpenTelemetry and Prometheus metrics initialisation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Export traces over OTLP/HTTP. Off by default so dev builds stay light.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
# Metrics facade + Prometheus text renderer (no built-in HTTP listener; the API serves /metrics itself).
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }

# OpenTelemetry (versions must move together: tracing-opentelemetry 0.34 <-> opentelemetry 0.33).
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", optional = true, default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34.0", optional = true }
