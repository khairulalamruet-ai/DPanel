# Built Panel control plane configuration (example).
# Install as /etc/builtpanel/control.toml (mode 0640, owner root:builtpanel),
# or point BUILTPANEL_CONFIG at another path.
#
# Every key can be overridden by environment variables:
#   BUILTPANEL_<SECTION>__<KEY>, e.g. BUILTPANEL_DATABASE__MAX_CONNECTIONS=20
# Unknown keys are rejected at startup.

listen = "127.0.0.1:8080"

# Reverse proxies whose X-Forwarded-For header is trusted for the client IP
# (exact addresses). Set this to the local Caddy when it fronts the API;
# leave empty when clients connect directly, otherwise clients could spoof
# their address and dodge login lockouts.
trusted_proxies = []   # e.g. ["127.0.0.1", "::1"]

[log]
format = "json"          # json | pretty
filter = "info"          # EnvFilter directives, e.g. "info,builtpanel=debug"
# otlp_endpoint = "http://127.0.0.1:4318/v1/traces"   # needs a build with --features otel

[database]
# Put the URL in a file readable only by the service user (chmod 0600).
url_file = "/etc/builtpanel/secrets/database_url"
max_connections = 10

[redis]
url_file = "/etc/builtpanel/secrets/redis_url"

[auth]
# Argon2id password hashing cost. Raising these makes every login slower;
# existing hashes are upgraded on the next successful login.
# Default is the OWASP baseline (19 MiB, t=2). Benchmark the server first:
#   BUILTPANEL_BENCH_ARGON2=65536,3,1 cargo test -p builtpanel-auth-core --release -- --ignored --nocapture benchmark
# and aim for roughly 200 ms per hash.
argon2_memory_kib = 19456   # KiB, minimum 19456
argon2_iterations = 2       # minimum 2
argon2_parallelism = 1

# Sessions: idle window (sliding) and absolute lifetime (fixed).
session_idle_minutes = 30     # 5..=1440
session_absolute_hours = 12   # 1..=720

# Sudo mode: sensitive actions (changing 2FA, ...) are allowed for this long
# after login or re-authentication; afterwards the user must confirm their
# password (and second factor, if enabled) again.
sudo_minutes = 10             # 1..=60

# Failed-login lockout. An account (or unknown login name) is locked after
# `lockout_threshold` failures within `lockout_window_minutes`; one client
# address (an IPv6 /64) after `ip_lockout_threshold`. Locked logins get
# 429 with Retry-After (`lockout_minutes` for an account, `ip_lockout_minutes` for an
# address), even with the right password.
lockout_threshold = 5          # 1..=100
lockout_window_minutes = 15    # 1..=1440
lockout_minutes = 15           # 1..=1440
ip_lockout_threshold = 10      # lockout_threshold..=100000
ip_lockout_minutes = 60        # 1..=10080

# Two-factor authentication: the name authenticator apps show for this panel.
totp_issuer = "Built Panel"

# Root login (like WHM): the administrator `root` logs in with this server's root password,
# checked by the builtpanel-root-auth helper on this socket. install.sh sets it up; remove the
# line (and run `bpctl admin root-login --disable`) to turn it off.
# root_login_socket = "/run/builtpanel-root-auth/root-auth.sock"

[secrets]
# Master key that encrypts secrets stored in the database (TOTP secrets, ...).
# Create once and back it up separately from the database:
#   (umask 077; openssl rand -base64 32 > /etc/builtpanel/secrets/master_key)
# If it is lost, users must re-enrol 2FA; if it leaks together with a database
# dump, stored TOTP secrets are exposed.
master_key_file = "/etc/builtpanel/secrets/master_key"

[pki]
# Where `bpctl ca init` put node_ca.crt and node_ca.key. Without a CA, node
# enrollment is switched off (the rest of the panel works).
ca_dir = "/etc/builtpanel/secrets"

[agent]
# Where node agents reach this control plane (its agent port). Shown to
# administrators in the command that enrols a new node. https is required;
# http only for localhost.
# public_url = "https://panel.example.com:8443"
# How long a new node's enrollment token stays valid, in minutes (1..=60).
enrollment_token_minutes = 15
# The agent port: agents connect here with their node certificate (mutual TLS,
# TLS 1.3). Needs server.crt and server.key next to the CA (`bpctl ca issue-server
# --out <pki.ca_dir>`). Set both or neither. Open this port to your nodes only.
# stream_listen = "0.0.0.0:8444"
# stream_url = "https://panel.example.com:8444"

[imports]
# Uploaded SQL dumps wait here until the node has fetched them, then they are
# removed. Needs room for a few of the biggest dumps (setting `max_import_mb` of
# the databases module, 1024 MB by default). Imports need `agent.public_url`.
# spool_dir = "/var/lib/builtpanel/spool/imports"
