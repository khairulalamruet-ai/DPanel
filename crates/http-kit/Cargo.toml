[package]
name = "builtpanel-http-kit"
description = "Axum extractors, middleware, problem-details errors and OpenAPI helpers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# HTTP framework used by control-api (fixed stack).
axum = "0.8"
builtpanel-observability.workspace = true
# Problem Details (RFC 9457) bodies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
# task_local! carries the correlation ID through the request.
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1.44"
utoipa = "6"
# UUIDv7 request IDs (time-ordered; also the planned DB primary key format).
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
# Drive routers in tests without opening sockets.
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
metrics = "0.24.6"
