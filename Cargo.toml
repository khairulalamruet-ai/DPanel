    "apps/worker",
    "apps/node-agent",
    "apps/priv-helper",
    "apps/root-auth",
    "apps/bpctl",
    "apps/license-authority",
    "crates/kernel",
    "crates/safe-fs",
    "crates/backup",
    "crates/catalog",
    "crates/license",
    "crates/license-client",
    "crates/backup-dest",
    "crates/system-backup",
    "crates/fileops",
    "crates/auth-core",
    "crates/cache",
    "crates/common",
    "crates/config",
    "crates/domain",
    "crates/database",
    "crates/http-kit",
    "crates/observability",
    "crates/session",
    "crates/rbac",
    "crates/audit",
    "crates/node-protocol",
    "crates/node-gateway",
    "crates/operations",
    "crates/dispatcher",
    "crates/events",
    "crates/feature-gate",
    "crates/settings",
    "crates/tenant-stack",
    "crates/web-config",
    "crates/docker-manager",
    "crates/pki",
    "crates/modules/auth",
    "crates/modules/admin",
    "crates/modules/nodes",
    "crates/modules/system",
    "crates/modules/plans",
    "crates/modules/users",
    "crates/modules/domains",
    "crates/modules/databases",
    "crates/modules/files",
    "crates/modules/apps",
    "crates/modules/license",
    "crates/modules/backups",
    "crates/modules/cron",
    "crates/modules/logs",
    "crates/modules/usage",
    "crates/modules/services",
    "crates/modules/security",
    "crates/dns",
    "crates/import",
    "crates/modules/migration",
