[package]
name = "builtpanel-mod-services"
description = "Services module: an account's own containers, listed and restarted."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-audit.workspace = true
builtpanel-database.workspace = true
builtpanel-http-kit.workspace = true
builtpanel-node-protocol.workspace = true
builtpanel-rbac.workspace = true
builtpanel-session.workspace = true
axum = { version = "0.8", features = ["ws"] }
builtpanel-mod-migration.workspace = true
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
# The terminal test: an SSH server that plays the node, and a WebSocket client that plays the browser.
russh = "0.65.2"
rand = "0.10"
anyhow = "1"
tokio-tungstenite.workspace = true
futures-util.workspace = true
secrecy = "0.10"
builtpanel-kernel.workspace = true
builtpanel-cache.workspace = true
builtpanel-settings.workspace = true
builtpanel-mod-auth.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["serde", "v7", "v4"] }
