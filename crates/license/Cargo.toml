[package]
name = "builtpanel-license"
description = "License documents: canonical JSON, Ed25519 signing and verification, entitlement claims."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The workspace's one crypto backend (rcgen and rustls use it too); Ed25519 is in it.
ring = "0.17"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
uuid = { version = "1", features = ["serde", "v4"] }
