[package]
name = "builtpanel-rbac"
description = "Role-based access control: permission keys, wildcard matching and the Require extractor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-database.workspace = true
builtpanel-http-kit.workspace = true
builtpanel-session.workspace = true
axum = "0.8"
tracing = "0.1.44"
uuid = "1"

[dev-dependencies]
builtpanel-cache.workspace = true
secrecy = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
