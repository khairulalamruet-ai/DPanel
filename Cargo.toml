[workspace.package]
version = "0.1.15"
edition = "2024"
rust-version = "1.100"
license = "LicenseRef-Built Panel-Proprietary"
publish = false
repository = "https://example.invalid/builtpanel"

[workspace.dependencies]
# Internal crates. External dependencies are added here (with a reason in the PR) by later tasks.
builtpanel-kernel = { path = "crates/kernel" }
builtpanel-auth-core = { path = "crates/auth-core" }
builtpanel-cache = { path = "crates/cache" }
builtpanel-common = { path = "crates/common" }
builtpanel-config = { path = "crates/config" }
builtpanel-domain = { path = "crates/domain" }
builtpanel-safe-fs = { path = "crates/safe-fs" }
builtpanel-backup = { path = "crates/backup" }
builtpanel-backup-dest = { path = "crates/backup-dest" }
builtpanel-system-backup = { path = "crates/system-backup" }
builtpanel-fileops = { path = "crates/fileops" }
builtpanel-database = { path = "crates/database" }
builtpanel-http-kit = { path = "crates/http-kit" }
builtpanel-observability = { path = "crates/observability" }
builtpanel-session = { path = "crates/session" }
builtpanel-rbac = { path = "crates/rbac" }
builtpanel-audit = { path = "crates/audit" }
builtpanel-node-protocol = { path = "crates/node-protocol" }
builtpanel-pki = { path = "crates/pki" }
builtpanel-web-config = { path = "crates/web-config" }
builtpanel-mod-auth = { path = "crates/modules/auth" }
builtpanel-mod-admin = { path = "crates/modules/admin" }
builtpanel-mod-nodes = { path = "crates/modules/nodes" }
builtpanel-mod-system = { path = "crates/modules/system" }
builtpanel-mod-plans = { path = "crates/modules/plans" }
builtpanel-mod-users = { path = "crates/modules/users" }
builtpanel-mod-domains = { path = "crates/modules/domains" }
builtpanel-mod-databases = { path = "crates/modules/databases" }
builtpanel-mod-files = { path = "crates/modules/files" }
builtpanel-mod-backups = { path = "crates/modules/backups" }
builtpanel-catalog = { path = "crates/catalog" }
builtpanel-license = { path = "crates/license" }
builtpanel-license-client = { path = "crates/license-client" }
builtpanel-mod-apps = { path = "crates/modules/apps" }
builtpanel-mod-license = { path = "crates/modules/license" }
builtpanel-mod-cron = { path = "crates/modules/cron" }
builtpanel-mod-mail = { path = "crates/modules/mail" }
builtpanel-mod-migration = { path = "crates/modules/migration" }
builtpanel-import = { path = "crates/import" }
builtpanel-mod-logs = { path = "crates/modules/logs" }
builtpanel-mod-notifications = { path = "crates/modules/notifications" }
builtpanel-mod-usage = { path = "crates/modules/usage" }
builtpanel-mod-services = { path = "crates/modules/services" }
builtpanel-mod-security = { path = "crates/modules/security" }
builtpanel-dns = { path = "crates/dns" }
builtpanel-node-gateway = { path = "crates/node-gateway" }
builtpanel-operations = { path = "crates/operations" }
builtpanel-dispatcher = { path = "crates/dispatcher" }
builtpanel-events = { path = "crates/events" }
builtpanel-feature-gate = { path = "crates/feature-gate" }
builtpanel-settings = { path = "crates/settings" }
builtpanel-tenant-stack = { path = "crates/tenant-stack" }
builtpanel-docker-manager = { path = "crates/docker-manager" }

# External crates shared by the agent and the control plane's agent port (T02.08).
# TLS 1.3 only, `ring` backend (the one rcgen and ureq already use); the WebSocket
# layer runs over a TLS stream we set up ourselves, so mTLS stays in our hands.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
