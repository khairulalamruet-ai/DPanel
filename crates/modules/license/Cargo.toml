[package]
name = "builtpanel-mod-license"
description = "License module: this installation's license, its checks against the license authority, and restricted mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-audit.workspace = true
builtpanel-config.workspace = true
builtpanel-database.workspace = true
builtpanel-http-kit.workspace = true
builtpanel-license.workspace = true
builtpanel-license-client.workspace = true
builtpanel-rbac.workspace = true
builtpanel-session.workspace = true
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["time", "sync", "rt"] }
tracing = "0.1.44"
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
builtpanel-auth-core.workspace = true
builtpanel-license-authority = { path = "../../../apps/license-authority" }
base64 = "0.23"
ureq = { version = "3", default-features = false, features = ["json"] }
builtpanel-kernel.workspace = true
builtpanel-cache.workspace = true
secrecy = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["serde", "v7", "v4"] }
