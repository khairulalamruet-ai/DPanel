# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Run locally: cargo deny check

[graph]
all-features = true

[advisories]
# Any RustSec vulnerability or unmaintained/unsound notice fails the check.
# Add an `ignore = [{ id = "RUSTSEC-...", reason = "..." }]` entry only with a written reason.
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys appears only in Cargo.lock through sqlx-sqlite, an optional driver of sqlx that no crate enables. `cargo tree -i libsqlite3-sys --target all --all-features` prints nothing, so no SQLite code is compiled or shipped. TODO: remove this entry once sqlx-sqlite depends on libsqlite3-sys >= 0.39." },
    { id = "RUSTSEC-2026-0543", reason = "chrono is flagged unmaintained, not vulnerable. It is pulled in by zxcvbn and russh, which we cannot drop today; no exploitable flaw is reported. TODO: re-check when zxcvbn or russh move to jiff/time, then remove this entry." },
]

[licenses]
confidence-threshold = 0.9
# Permissive licenses compatible with a proprietary, distributed product.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    # The zero-clause BSD: as permissive as a license gets (quoted_printable, which lettre needs).
    "0BSD",
]
# Our own crates are unpublished (publish = false) and proprietary.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
