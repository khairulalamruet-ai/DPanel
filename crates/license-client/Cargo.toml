[package]
name = "builtpanel-license-client"
description = "Built Panel's side of licensing: installation identity, talking to the license authority, and what an entitlement allows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-license.workspace = true
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
# Blocking and small, like the other places that call out; rustls with ring.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
