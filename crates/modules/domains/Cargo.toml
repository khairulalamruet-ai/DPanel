[package]
name = "builtpanel-mod-domains"
description = "Domains module: the names a hosting account serves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-audit.workspace = true
builtpanel-auth-core.workspace = true
builtpanel-cache.workspace = true
builtpanel-database.workspace = true
builtpanel-dns.workspace = true
builtpanel-domain.workspace = true
builtpanel-events.workspace = true
builtpanel-kernel.workspace = true
builtpanel-http-kit.workspace = true
builtpanel-node-protocol.workspace = true
builtpanel-pki.workspace = true
builtpanel-rbac.workspace = true
builtpanel-session.workspace = true
builtpanel-settings.workspace = true
builtpanel-tenant-stack.workspace = true
builtpanel-web-config.workspace = true
axum = "0.8"
serde = { version = "1", features = ["derive"] }
secrecy = "0.10"
serde_json = "1"
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
time = "0.3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["serde", "v7"] }
