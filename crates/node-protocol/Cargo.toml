[package]
name = "builtpanel-node-protocol"
description = "Wire types shared by the control plane and the node agent (ADR 0004)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
uuid = { version = "1", features = ["serde"] }
# Lets the control plane describe these types in its OpenAPI document; the agent does not need it.
utoipa = { version = "6", features = ["uuid"], optional = true }

[features]
openapi = ["dep:utoipa"]
