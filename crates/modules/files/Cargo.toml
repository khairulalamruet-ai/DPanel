[package]
name = "builtpanel-mod-files"
description = "Files module: the file manager's API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-audit.workspace = true
builtpanel-auth-core.workspace = true
builtpanel-database.workspace = true
builtpanel-domain.workspace = true
builtpanel-http-kit.workspace = true
builtpanel-node-protocol.workspace = true
builtpanel-rbac.workspace = true
builtpanel-session.workspace = true
builtpanel-settings.workspace = true
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "fs", "io-util", "rt"] }
sha2 = "0.11"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
sha2 = "0.11"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
builtpanel-fileops.workspace = true
builtpanel-safe-fs.workspace = true
secrecy = "0.10"
builtpanel-kernel.workspace = true
builtpanel-cache.workspace = true
builtpanel-mod-auth.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["serde", "v7", "v4"] }
