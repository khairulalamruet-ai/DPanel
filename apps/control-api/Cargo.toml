[package]
name = "builtpanel-control-api"
description = "Built Panel control plane HTTP API (Axum)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "builtpanel-control-api"
path = "src/main.rs"

[features]
default = []
# Build with OpenTelemetry span export (see builtpanel-observability).
otel = ["builtpanel-observability/otel"]

[dependencies]
builtpanel-audit.workspace = true
builtpanel-auth-core.workspace = true
builtpanel-node-protocol.workspace = true
# Reads the master key out of its SecretString wrapper at startup.
secrecy = "0.10"
builtpanel-cache.workspace = true
builtpanel-common.workspace = true
builtpanel-config.workspace = true
builtpanel-database.workspace = true
serde_json = "1"
builtpanel-http-kit.workspace = true
builtpanel-mod-admin.workspace = true
builtpanel-mod-auth.workspace = true
builtpanel-mod-nodes.workspace = true
builtpanel-mod-plans.workspace = true
builtpanel-mod-system.workspace = true
builtpanel-mod-users.workspace = true
builtpanel-mod-domains.workspace = true
builtpanel-mod-databases.workspace = true
builtpanel-mod-files.workspace = true
builtpanel-mod-backups.workspace = true
builtpanel-catalog.workspace = true
builtpanel-mod-apps.workspace = true
builtpanel-mod-license.workspace = true
builtpanel-mod-cron.workspace = true
builtpanel-mod-mail.workspace = true
builtpanel-mod-migration.workspace = true
builtpanel-mod-logs.workspace = true
builtpanel-mod-notifications.workspace = true
builtpanel-mod-usage.workspace = true
builtpanel-mod-services.workspace = true
builtpanel-mod-security.workspace = true
builtpanel-backup.workspace = true
builtpanel-backup-dest.workspace = true
builtpanel-system-backup.workspace = true
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
builtpanel-dispatcher.workspace = true
builtpanel-dns.workspace = true
builtpanel-events.workspace = true
builtpanel-kernel.workspace = true
builtpanel-node-gateway.workspace = true
builtpanel-operations.workspace = true
builtpanel-settings.workspace = true
builtpanel-observability.workspace = true
builtpanel-pki.workspace = true
builtpanel-session.workspace = true
# HTTP framework and async runtime (fixed stack).
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
# Loading the node CA checks its validity against the current time.
time = "0.3"
# Standard HTTP middleware: timeout, body limit, gzip, panic -> 500.
tower-http = { version = "0.7", features = ["timeout", "limit", "compression-gzip", "catch-panic"] }
utoipa = "6"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "migrate"] }
# The manifest tests compare declared permission keys with the ones the code checks.
builtpanel-rbac.workspace = true
tower = { version = "0.5", features = ["util"] }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
