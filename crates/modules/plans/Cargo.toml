[package]
name = "builtpanel-mod-plans"
description = "Plans module: feature sets and hosting plans."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-audit.workspace = true
builtpanel-database.workspace = true
builtpanel-http-kit.workspace = true
builtpanel-kernel.workspace = true
builtpanel-rbac.workspace = true
builtpanel-session.workspace = true
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
builtpanel-cache.workspace = true
secrecy = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["serde", "v7"] }
