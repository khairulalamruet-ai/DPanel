# Builds the PHP images tenants run (deploy/images/php), the web, database, database-browser
# and SFTP images (deploy/images/*) and the Caddy image with the Coraza
# WAF (deploy/caddy, T11.01), scans them and publishes
# them to ghcr.io (T06.01). The digest it prints goes into deploy/stack/images.toml
# as `preferred` in a reviewed change; until then, and whenever the image cannot be
# pulled on a node, the official image listed beside it is used.
name: rust-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deploy/images/**
      - deploy/caddy/**
      - .github/workflows/rust-images.yml
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: deploy/images/php
          build-args: PHP_VERSION=${{ matrix.php }}
          load: true
          tags: builtpanel-php:${{ matrix.php }}
      - name: Scan (a critical vulnerability stops the publish)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: builtpanel-php:${{ matrix.php }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Publish
        id: push
        uses: docker/build-push-action@v7
        with:
          context: deploy/images/php
          build-args: PHP_VERSION=${{ matrix.php }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/builtpanel-php:${{ matrix.php }}
      - name: Digest to pin
        run: echo "ghcr.io/${{ github.repository_owner }}/builtpanel-php@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # The web server, database, database browser and SFTP images: the official image pinned in
  # deploy/stack/images.toml with its operating system packages upgraded (and, for the database
  # and the browser, the outside program or the libraries that carry the fixable findings
  # replaced). deploy/dev/build-images.sh does the same on a build box and shows the numbers.
  roles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [web, db, pma, sftp]
    steps:
      - uses: actions/checkout@v7
      - name: The official image this role is built from
        id: base
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          images = tomllib.load(open("deploy/stack/images.toml", "rb"))["image"]
          print("ref=" + next(i["reference"] for i in images if i["role"] == "${{ matrix.role }}"))
          PY
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: deploy/images/${{ matrix.role }}
          build-args: BASE=${{ steps.base.outputs.ref }}
          load: true
          tags: builtpanel-${{ matrix.role }}:test
      - name: Scan (a critical vulnerability that has a fix stops the publish)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: builtpanel-${{ matrix.role }}:test
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Publish
        id: push
        uses: docker/build-push-action@v7
        with:
          context: deploy/images/${{ matrix.role }}
          build-args: BASE=${{ steps.base.outputs.ref }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/builtpanel-${{ matrix.role }}:latest
      - name: Digest to pin
        run: |
          echo "${{ matrix.role }} ghcr.io/${{ github.repository_owner }}/builtpanel-${{ matrix.role }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  caddy-waf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: deploy/caddy
          load: true
          tags: builtpanel-caddy-waf:test
      - name: The WAF blocks what it should (deploy/dev/waf-live.sh)
        run: bash deploy/dev/waf-live.sh
      - name: Scan (a critical vulnerability stops the publish)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: builtpanel-caddy-waf:test
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Publish
        id: push
        uses: docker/build-push-action@v7
        with:
          context: deploy/caddy
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/builtpanel-caddy-waf:latest
      - name: Digest to pin
        run: echo "ghcr.io/${{ github.repository_owner }}/builtpanel-caddy-waf@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
