[package]
name = "builtpanel-feature-gate"
description = "Plan-based gating: is this feature on for the tenant, is one more allowed under the limit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-cache.workspace = true
builtpanel-http-kit.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
secrecy = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
uuid = { version = "1", features = ["serde", "v7"] }
