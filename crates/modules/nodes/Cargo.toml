[package]
name = "builtpanel-mod-nodes"
description = "Nodes module: add servers to the panel with one-time enrollment tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-audit.workspace = true
builtpanel-cache.workspace = true
builtpanel-database.workspace = true
builtpanel-http-kit.workspace = true
builtpanel-node-gateway.workspace = true
builtpanel-operations.workspace = true
builtpanel-node-protocol = { workspace = true, features = ["openapi"] }
builtpanel-pki.workspace = true
builtpanel-rbac.workspace = true
builtpanel-session.workspace = true
axum = "0.8"
base64 = "0.23"
getrandom = "0.4"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tracing = "0.1.44"
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["serde", "v7"] }
# Certificate validity and timestamps (the type the CA works with).
time = "0.3"

[dev-dependencies]
# Tests play the agent: they make a key and a certificate request, and inspect
# the certificate they get back. Same versions the CA crate already uses.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
x509-parser = { version = "0.18", features = ["verify"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
