[package]
name = "builtpanel-mod-system"
description = "System module: switch modules on and off (settings and bootstrap follow)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-audit.workspace = true
builtpanel-database.workspace = true
builtpanel-events.workspace = true
builtpanel-http-kit.workspace = true
builtpanel-kernel.workspace = true
builtpanel-observability.workspace = true
builtpanel-rbac.workspace = true
builtpanel-settings.workspace = true
builtpanel-session.workspace = true
axum = "0.8"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
tracing = "0.1.44"
utoipa = { version = "6", features = ["uuid"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
builtpanel-settings.workspace = true
builtpanel-cache.workspace = true
secrecy = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["serde", "v7"] }
