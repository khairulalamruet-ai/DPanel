# The base settings of the WAF (T11.01), read before the OWASP Core Rule Set.
# SecRuleEngine is set by the site (On blocks, DetectionOnly only logs, Off does nothing).
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
SecArgumentsLimit 1000
# What a block leaves in the log: the rule (part K), the address, the address asked for.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(403|5[0-9][0-9])$"
SecAuditLogParts ABIJDEFHKZ
SecAuditLogType Serial
# A file, not standard error: the node agent reads it to show a hosting account what was refused
# (BUILTPANEL_AGENT_WAF_LOG, the same path). The file holds request data of every site: it is
# readable by the web server's user and group only; rotate it (deploy/caddy/waf-audit.logrotate).
SecAuditLog /var/log/caddy/waf-audit.log
SecAuditLogFileMode 0640
SecAuditLogFormat JSON
SecDebugLogLevel 0
