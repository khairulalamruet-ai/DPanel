[package]
name = "builtpanel-mod-migration"
description = "Migration module: bring an account over from another hosting panel (T15.04, T15.06)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-audit.workspace = true
builtpanel-database.workspace = true
builtpanel-domain.workspace = true
builtpanel-http-kit.workspace = true
builtpanel-import.workspace = true
builtpanel-kernel.workspace = true
builtpanel-rbac.workspace = true
builtpanel-session.workspace = true
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json"] }
sha2 = "0.11"
secrecy = "0.10"
russh = "0.65.2"
russh-sftp = "3.0.1"
tower = { version = "0.5", features = ["util"] }
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
builtpanel-cache.workspace = true
builtpanel-mod-auth.workspace = true
tar = { version = "0.4.46", default-features = false }
rand = "0.10"
anyhow = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
