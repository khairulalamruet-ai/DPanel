[package]
name = "builtpanel-license-authority"
description = "Built Panel license authority: customers, licenses, activations and signed entitlements."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "builtpanel_license_authority"
path = "src/lib.rs"

[[bin]]
name = "builtpanel-license-authority"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
builtpanel-auth-core.workspace = true
builtpanel-http-kit.workspace = true
builtpanel-license.workspace = true
builtpanel-observability.workspace = true
axum = "0.8"
base64 = "0.23"
figment = { version = "0.10", features = ["toml", "env"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "migrate", "macros"] }
thiserror = "2.0.21"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tracing = "0.1.44"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
builtpanel-license-client.workspace = true
figment = { version = "0.10", features = ["toml", "env", "test"] }
tower = { version = "0.5", features = ["util"] }
