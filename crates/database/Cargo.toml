[package]
name = "builtpanel-database"
description = "PostgreSQL pool, transaction helpers, migrations and tenant-scoped repository base."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-domain.workspace = true
# Async PostgreSQL driver + migrations (fixed stack). No TLS yet: the database
# listens on localhost / a private network; TLS is added with remote DB support.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "time", "json"] }
# Database URL stays wrapped so it never reaches logs.
secrecy = "0.10"
# `now_v7` is used by the resellers store; sqlx brings uuid in but without this feature.
uuid = { version = "1", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
builtpanel-rbac.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
