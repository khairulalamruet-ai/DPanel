[package]
name = "builtpanel-operations"
description = "The operations ledger service: enqueue typed node operations with idempotency keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-database.workspace = true
builtpanel-node-protocol.workspace = true
serde_json = "1"
thiserror = "2.0.21"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["serde", "v7"] }
