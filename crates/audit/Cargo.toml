[package]
name = "builtpanel-audit"
description = "Append-only audit log: writer and the administrator-facing read API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-database.workspace = true
builtpanel-http-kit.workspace = true
builtpanel-rbac.workspace = true
builtpanel-session.workspace = true
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "time"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing = "0.1.44"
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
builtpanel-cache.workspace = true
secrecy = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
