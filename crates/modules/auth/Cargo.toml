[package]
name = "builtpanel-mod-auth"
description = "Auth module: login, logout and current-account endpoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
builtpanel-auth-core.workspace = true
builtpanel-audit.workspace = true
builtpanel-cache.workspace = true
builtpanel-database.workspace = true
builtpanel-domain.workspace = true
builtpanel-http-kit.workspace = true
builtpanel-session.workspace = true
axum = "0.8"
# Lockout keys for unknown login names are SHA-256 hashed (no raw user input
# in Redis key names).
base64 = "0.23"
# OS CSPRNG for the pending-2FA token.
getrandom = "0.4"
sha2 = "0.11"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The client of the root login helper (a Unix socket, with a time limit).
thiserror = "2.0.21"
tokio = { version = "1", features = ["net", "io-util", "time"] }
tracing = "0.1.44"
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
