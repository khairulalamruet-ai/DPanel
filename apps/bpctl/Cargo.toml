[package]
name = "builtpanel-bpctl"
description = "Built Panel admin CLI for bootstrap, migrations and recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bpctl"
path = "src/main.rs"

[dependencies]
builtpanel-auth-core.workspace = true
builtpanel-common.workspace = true
builtpanel-config.workspace = true
builtpanel-database.workspace = true
builtpanel-domain.workspace = true
builtpanel-license.workspace = true
builtpanel-pki.workspace = true
builtpanel-system-backup.workspace = true
# Subcommand parsing; bpctl grows many commands (migrate, admin, ca, ...).
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Reads passwords from the terminal without echo.
rpassword = "7.5.5"
secrecy = "0.10"
# Certificate validity periods.
time = "0.3"
# The signed release manifest is read and written as JSON.
serde_json = "1"

[lints]
workspace = true
